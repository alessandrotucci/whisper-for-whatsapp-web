# Costruisce il componente locale per Windows (whisper_host.exe con PyInstaller e
# l'installer con Inno Setup) e per Linux (PyInstaller su Ubuntu 22.04 e tarball con
# install.sh), più i pacchetti dell'estensione.
# Un tag v* pubblica una release con tutti i file e il loro SHA256SUMS, che il
# componente per Linux verifica prima di aggiornarsi; l'avvio manuale costruisce
# soltanto e lascia i file come artifact.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Controllo delle versioni
        run: python tools/release_check.py --tag '${{ github.ref_name }}' --release-json build/release.json

      - name: Prova del service worker
        run: node tools/sw_smoke_test.js extension

      - name: Dipendenze di build
        run: python -m pip install --disable-pip-version-check -r host/requirements-build.txt

      - name: whisper_host.exe
        working-directory: host
        run: python -m PyInstaller --noconfirm --distpath ../build/dist --workpath ../build/work whisper_host.spec

      - name: Prova dell'eseguibile
        run: build\dist\whisper_host\whisper_host.exe --info

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Installer
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          if ($v -notmatch '^\d') { $v = '0.0.0-dev' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$v" installer\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exit $LASTEXITCODE" }

      - name: Zip dell'estensione
        shell: pwsh
        run: Compress-Archive -Path extension\*, build\release.json -DestinationPath build\installer\whisper-for-whatsapp-web-extension.zip

      - name: Pacchetti per gli store
        run: |
          python tools/build_extension.py firefox --zip build/installer/whisper-for-whatsapp-web-firefox.zip
          python tools/build_extension.py store --zip build/installer/whisper-for-whatsapp-web-store.zip

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: build/installer/*

  linux:
    # glibc della build = glibc minima richiesta: 2.35 su Ubuntu 22.04 (install.sh la controlla).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Controllo delle versioni
        run: python tools/release_check.py --tag '${{ github.ref_name }}'

      - name: Dipendenze di build
        run: python -m pip install --disable-pip-version-check -r host/requirements-build.txt

      - name: whisper_host
        working-directory: host
        run: python -m PyInstaller --noconfirm --distpath ../build/dist --workpath ../build/work whisper_host.spec

      - name: Prova dell'eseguibile
        run: build/dist/whisper_host/whisper_host --info

      - name: Tarball
        run: python tools/package_linux.py

      - name: Prova dell'installazione
        run: |
          # Utente simulato in una home vuota: anche le cartelle XDG del runner restano fuori.
          export HOME="$RUNNER_TEMP/home"
          unset XDG_CONFIG_HOME XDG_DATA_HOME XDG_CACHE_HOME
          mkdir -p "$HOME/.config/google-chrome" "$RUNNER_TEMP/pkg"
          tar xzf build/installer/whisper-for-whatsapp-web-linux-x86_64.tar.gz -C "$RUNNER_TEMP/pkg"
          "$RUNNER_TEMP/pkg/whisper-for-whatsapp-web/install.sh"
          cat "$HOME/.local/lib/whisper-for-whatsapp-web/manifests.txt"
          manifest="$HOME/.config/google-chrome/NativeMessagingHosts/local.wa_whisper.host.json"
          exe=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['path'])" "$manifest")
          "$exe" --info
          "$HOME/.local/lib/whisper-for-whatsapp-web/current/uninstall.sh"
          test ! -e "$manifest"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: build/installer/*

  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: assets
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' assets/* --title '${{ github.ref_name }}' --notes-file .github/release-notes.md --generate-notes
