<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whisper for WhatsApp Web</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    main { max-width: 820px; margin: 0 auto; padding: 24px 16px 60px; }
    .step { display: flex; gap: 14px; padding: 14px 16px; margin: 12px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
    .step > .num { flex: 0 0 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; border: 2px solid var(--line); color: var(--muted); }
    .step > .body { flex: 1; min-width: 0; }
    .step h2 { margin: 2px 0 6px; font-size: 16px; }
    .step[data-state="done"] > .num { background: var(--ok); border-color: var(--ok); color: var(--bg); }
    .step[data-state="active"] > .num { border-color: var(--accent); color: var(--accent); }
    .step[data-state="searching"] { border-color: var(--accent); }
    .step[data-state="searching"] > .num { border-color: var(--accent); color: var(--accent); animation: wwt-pulse 1.6s ease-out infinite; }
    #hostStatus.searching { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-weight: 600; }
    #hostStatus .searching-time { font-weight: 400; font-size: 12.5px; }
    .wwt-search-spinner { width: 16px; height: 16px; border: 2.5px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: wwt-spin 0.8s linear infinite; flex: 0 0 auto; }
    @keyframes wwt-spin { to { transform: rotate(360deg); } }
    @keyframes wwt-pulse {
      0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }
      100% { box-shadow: 0 0 0 12px color-mix(in srgb, var(--accent) 0%, transparent); }
    }
    @media (prefers-reduced-motion: reduce) {
      .wwt-search-spinner, .step[data-state="searching"] > .num { animation: none; }
    }
    .step[data-state="locked"] { opacity: 0.55; }
    .step[data-state="locked"] .body > :not(h2) { display: none; }
    .models { display: grid; gap: 8px; margin: 10px 0; }
    .model { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); flex-wrap: wrap; }
    .model.current { border-color: var(--accent); }
    .model .name { font-weight: 600; }
    .model .grow { flex: 1; min-width: 160px; }
    progress { width: 100%; height: 8px; margin-top: 6px; accent-color: var(--accent); }
    details { margin-top: 28px; }
    summary { cursor: pointer; font-weight: 600; font-size: 16px; }
    .upd-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; font-size: 13px; }
    .upd-bar button { padding: 3px 10px; font-size: 13px; }
    .upd-last { font-size: 12px; margin: 4px 0 0; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
    @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
    [hidden] { display: none !important; }
    .light { font-weight: 400; font-size: 14px; }
    .small { font-size: 12.5px; }
    select.inline { width: auto; display: inline-block; margin-left: 6px; padding: 2px 6px; }
    .ai-list { display: grid; gap: 8px; margin: 8px 0; }
    .ai { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); flex-wrap: wrap; }
    .ai:first-child { border-color: var(--accent); }
    .ai-ord { width: 20px; text-align: center; font-weight: 700; color: var(--muted); }
    .ai-logo { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 7px; display: inline-grid; place-items: center; color: #fff; font-weight: 700; font-size: 12px; }
    .ai-name { flex: 1; min-width: 170px; line-height: 1.35; }
    .ai-model { display: flex; flex-direction: column; min-width: 220px; max-width: 320px; }
    .ai-model select { padding: 3px 6px; }
    .ai-btns { display: flex; gap: 4px; flex-wrap: wrap; }
    .ai-btns button { padding: 3px 9px; font-size: 13px; }
    .ai-test { flex-basis: 100%; font-size: 12.5px; margin: 0 0 0 30px; }
    dialog { border: none; border-radius: 12px; padding: 16px 18px; width: min(900px, calc(100vw - 32px)); background: var(--bg); color: var(--fg); box-shadow: 0 8px 30px rgba(0,0,0,.25); }
    dialog.narrow { width: min(560px, calc(100vw - 32px)); }
    dialog::backdrop { background: rgba(31,35,40,.45); }
    .dlg-head { display: flex; align-items: center; gap: 10px; font-size: 16px; margin-bottom: 6px; }
    button.plain { border: none; background: none; font-size: 17px; padding: 0 4px; }
    button.close { margin-left: auto; }
    .prov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-top: 12px; }
    .prov { display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px 10px; background: var(--bg); line-height: 1.3; }
    .prov:hover { border-color: var(--accent); }
    .prov .muted { font-size: 12px; }
    .tag { display: inline-block; padding: 0 6px; border-radius: 8px; font-size: 11.5px; background: color-mix(in srgb, var(--ok) 14%, var(--bg)); color: var(--ok); }
    .tag.acc { background: color-mix(in srgb, #6467f2 16%, var(--bg)); color: #6467f2; }
    .tag.loc { background: color-mix(in srgb, var(--muted) 16%, var(--bg)); color: var(--fg); }
    .guide { margin: 8px 0 10px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--panel); }
    .guide summary { font-size: 14px; }
    .g-steps { margin: 6px 0; padding-left: 20px; }
    .g-steps li { margin: 10px 0; font-size: 13px; }
    .g-steps img { display: block; margin-top: 5px; max-width: 100%; max-height: 160px; border: 1px solid var(--line); border-radius: 6px; cursor: zoom-in; }
    .g-steps img.big { max-height: none; cursor: zoom-out; }
    .row.end { justify-content: flex-end; margin-top: 8px; }
  </style>
</head>
<body>
<main>
  <h1 data-i18n="extName"></h1>
  <p class="muted" data-i18n="opt_tagline"></p>
  <div class="upd-bar">
    <span id="updVersions"></span>
    <button id="checkUpdates" data-i18n="upd_check_now"></button>
    <span id="updStatus" class="muted"></span>
  </div>
  <p class="muted upd-last" id="updLast"></p>
  <div id="updateBox" hidden></div>

  <section class="step" id="step1" data-state="active">
    <div class="num">1</div>
    <div class="body">
      <h2 data-i18n="opt_step1"></h2>
      <p id="hostStatus" class="muted" data-i18n="opt_checking"></p>
      <div id="hostMissing" hidden>
        <p data-i18n-html="opt_host_explain"></p>
        <div class="row">
          <a class="button primary" id="installerLink" href="#" target="_blank" rel="noopener" data-i18n="opt_download_installer"></a>
          <span class="muted" data-i18n="opt_autodetect"></span>
        </div>
        <p class="muted" data-i18n-html="opt_smartscreen"></p>
        <p class="muted" id="hostError"></p>
      </div>
    </div>
  </section>

  <section class="step" id="step2" data-state="locked">
    <div class="num">2</div>
    <div class="body">
      <h2 data-i18n="opt_step2"></h2>
      <p class="muted" data-i18n="opt_models_intro"></p>
      <div class="models" id="models"></div>
      <div class="row">
        <button id="pickFolder" data-i18n="opt_pick_folder"></button>
        <span id="modelMsg" class="muted"></span>
      </div>
    </div>
  </section>

  <section class="step" id="step3" data-state="locked">
    <div class="num">3</div>
    <div class="body">
      <h2 data-i18n="opt_step3"></h2>
      <p data-i18n-html="opt_ready"></p>
    </div>
  </section>

  <section class="step" id="step4" data-state="active">
    <div class="num">4</div>
    <div class="body">
      <h2><span data-i18n="ai_title"></span> <span class="muted light" data-i18n="ai_optional"></span></h2>
      <p class="muted" data-i18n="ai_intro"></p>
      <label class="check" id="aiReviseRow"><input type="checkbox" id="aiRevise"><span><strong data-i18n="ai_revise"></strong><br><span class="muted small" data-i18n="ai_revise_note"></span></span></label>
      <label class="check" id="aiTranslateRow"><input type="checkbox" id="aiTranslate"><span><strong data-i18n="ai_translate"></strong> <select id="aiTarget" class="inline"></select></span></label>
      <p class="muted small" id="aiEmptyNote" data-i18n="ai_empty_note" hidden></p>
      <div id="aiAccountsBox" hidden>
        <h3 data-i18n="ai_accounts"></h3>
        <p class="muted small" id="aiTimeoutLine"></p>
        <div class="ai-list" id="aiAccounts"></div>
      </div>
      <div class="row" style="margin-top: 10px"><button class="primary" id="aiAdd" data-i18n="ai_add"></button> <span id="aiMsg" class="muted"></span></div>
      <label class="check" id="aiContextRow" hidden><input type="checkbox" id="aiContext"><span><strong data-i18n="ai_context"></strong><br><span class="muted small" data-i18n="ai_context_note"></span></span></label>
      <p class="muted small" data-i18n="ai_keys_note"></p>
    </div>
  </section>

  <dialog id="aiDialog">
    <div class="dlg-head"><button class="plain" id="aiBack" hidden>&larr;</button><span id="aiDlgLogo"></span><strong id="aiDlgTitle"></strong><button class="plain close" id="aiClose">&#10005;</button></div>
    <div id="aiPick">
      <p class="muted small" data-i18n="ai_pick_note"></p>
      <div class="prov-grid" id="aiProviders"></div>
    </div>
    <div id="aiForm" hidden>
      <details class="guide" id="aiGuide" open><summary><span data-i18n="ai_guide"></span> <span class="muted small" id="aiGuideMeta"></span></summary>
        <p class="muted small" data-i18n="ai_guide_what"></p>
        <ol class="g-steps" id="aiGuideSteps"></ol>
        <p class="small"><a id="aiGuideFull" target="_blank" rel="noopener" data-i18n="ai_guide_full"></a></p>
      </details>
      <div id="aiOauthBox" hidden><div class="row"><button class="primary" id="aiOauth" data-i18n="ai_oauth"></button> <a href="#" class="small" id="aiPasteKey" data-i18n="ai_paste_key"></a></div></div>
      <div id="aiKeyBox">
        <div class="field" id="aiUrlField"><label for="aiUrl" data-i18n="ai_url"></label><input type="text" id="aiUrl" spellcheck="false"></div>
        <div class="field" id="aiKeyField"><label for="aiKey" data-i18n="ai_key"></label><input type="password" id="aiKey" autocomplete="off" spellcheck="false"></div>
        <div class="row"><button id="aiVerify" data-i18n="ai_verify"></button> <span id="aiVerifyMsg"></span></div>
        <div class="field" id="aiModelField" hidden><label for="aiModel" data-i18n="ai_model"></label><select id="aiModel"></select>
          <p class="muted small" data-i18n="ai_model_note"></p></div>
        <div class="row end"><button id="aiCancel" data-i18n="ai_cancel"></button><button class="primary" id="aiConnect" disabled data-i18n="ai_connect"></button></div>
      </div>
      <p id="aiFormMsg" class="small"></p>
    </div>
  </dialog>

  <details id="settingsBox">
    <summary data-i18n="opt_settings"></summary>
    <div class="panel" style="margin-top: 10px">
      <label class="check"><input type="checkbox" id="autoIncoming"><span data-i18n-html="opt_auto_incoming"></span></label>
      <label class="check"><input type="checkbox" id="autoOutgoing"><span data-i18n-html="opt_auto_outgoing"></span></label>
      <label class="check"><input type="checkbox" id="autoVisible"><span data-i18n-html="opt_auto_visible"></span></label>
      <div class="grid2">
        <div class="field"><label for="language" data-i18n="opt_language"></label>
          <input type="text" id="language" list="langs" data-i18n-placeholder="opt_language_ph">
          <datalist id="langs"><option value="it"><option value="pt"><option value="es"><option value="en"><option value="fr"><option value="de"><option value="zh"></datalist></div>
        <div class="field"><label for="beamSize" data-i18n="opt_beam"></label><input type="number" id="beamSize" min="1" max="10"></div>
      </div>
      <div class="field"><label for="initialPrompt" data-i18n="opt_prompt"></label>
        <textarea id="initialPrompt" data-i18n-placeholder="opt_prompt_ph"></textarea></div>
      <label class="check"><input type="checkbox" id="vadFilter"><span data-i18n="opt_vad"></span></label>
      <div class="field" style="max-width: 340px"><label for="idleMinutes" data-i18n="opt_idle"></label><input type="number" id="idleMinutes" min="1" max="240"></div>
      <p class="muted" data-i18n="opt_memory_note"></p>
      <span id="saved" class="ok"></span>

      <h3 data-i18n="opt_advanced"></h3>
      <div class="grid2">
        <div class="field"><label for="hDevice" data-i18n="opt_device"></label>
          <select id="hDevice"><option value="cpu" data-i18n="opt_device_cpu"></option><option value="cuda" data-i18n="opt_device_cuda"></option><option value="auto" data-i18n="opt_device_auto"></option></select></div>
        <div class="field"><label for="hCompute" data-i18n="opt_compute"></label>
          <select id="hCompute"><option>int8</option><option>int8_float32</option><option>float32</option><option>float16</option><option>int8_float16</option></select></div>
        <div class="field"><label for="hThreads" data-i18n="opt_threads"></label><input type="number" id="hThreads" min="0" max="64"></div>
      </div>
      <div id="cudaBox" class="cuda" hidden>
        <p id="cudaDriver"></p>
        <p id="cudaLibs"></p>
        <div class="row"><button id="cudaInstall" hidden data-i18n="opt_cuda_download"></button> <progress id="cudaBar" hidden></progress></div>
        <p id="cudaMsg" class="muted"></p>
      </div>
      <div class="row"><button id="saveHost" disabled data-i18n="opt_apply"></button> <span id="hostSaved" class="muted"></span></div>
      <div id="hostDetails"></div>

      <h3 data-i18n="opt_saved_transcripts"></h3>
      <div class="row"><span id="cacheInfo" class="muted"></span> <button id="clearCache" data-i18n="opt_clear_cache"></button></div>
      <p class="muted" data-i18n="opt_cache_note"></p>
    </div>
  </details>
</main>
<script src="i18n.js"></script>
<script src="options.js"></script>
<script src="ai-options.js"></script>
<script src="update-ui.js"></script>
</body>
</html>
